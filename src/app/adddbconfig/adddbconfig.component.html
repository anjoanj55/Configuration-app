<div class="registration-container">
    <mat-card class="registration-card">
      <mat-card-header>
        <mat-card-title>Add DbConfig</mat-card-title>
      </mat-card-header>
  
      <mat-card-content>
        <form [formGroup]="customerForm" (ngSubmit)="onSubmit()">
          <div class="form-grid">
            <div class="form-row">
              <!-- <mat-form-field appearance="outline">
                <mat-label>License Type</mat-label>
                <input matInput formControlName="licenseType" placeholder="Enter license type">
              </mat-form-field> -->
  
              <mat-form-field appearance="outline">
                <mat-label>Customer Name</mat-label>
                <input matInput formControlName="custName" placeholder="Enter customer name">
              </mat-form-field>
  
              <mat-form-field appearance="outline">
                <mat-label>Db Name</mat-label>
                <input matInput formControlName="address" placeholder="Enter full address">
              </mat-form-field>
            </div>
  
          </div>
  
          <div class="button-container">
            <button mat-button color="primary" type="submit">
              <mat-icon>save</mat-icon> Save
            </button>
            <button mat-button color="primary" (click)="onReset()">
              <mat-icon>refresh</mat-icon> Reset
            </button>
            <button mat-button color="primary" (click)="goBackToCustomers()">
              <mat-icon>arrow_back</mat-icon> Back
            </button>
          
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
