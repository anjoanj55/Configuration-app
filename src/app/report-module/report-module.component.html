<div class="registration-container">
  <mat-card class="registration-card">
    <mat-card-header>
      <mat-card-title>
        <label class="heading"> {{ isEditMode ? 'Edit Report' : 'Add Report' }} </label>
      </mat-card-title>
    </mat-card-header>
    <hr class="divider">

    <mat-card-content>
      <form [formGroup]="reportForm" (ngSubmit)="onSubmit()">
        <div class="form-grid">
          
          <div class="form-row">
            <!-- Select Customer Dropdown -->
            <mat-form-field appearance="outline">
              <mat-label>Select Customer</mat-label>
              <mat-select formControlName="custName" placeholder="Choose a customer">
                <mat-option *ngFor="let customer of customerNames" [value]="customer">
                  {{ customer }}
                </mat-option>
              </mat-select>
            </mat-form-field>

            <!-- Industry Name -->
            <mat-form-field appearance="outline">
              <mat-label>Industry</mat-label>
              <input matInput formControlName="industryname" placeholder="Enter Industry name">
            </mat-form-field>
          </div>

          <div class="form-row">
            <!-- Report ID -->
            <mat-form-field appearance="outline">
              <mat-label>Report ID</mat-label>
              <input matInput formControlName="reportid" placeholder="Enter Report ID">
            </mat-form-field>

            <!-- Report Name -->
            <mat-form-field appearance="outline">
              <mat-label>Report Name</mat-label>
              <input matInput formControlName="reportname" placeholder="Enter Report Name">
            </mat-form-field>
          </div>

          <div class="form-row">
            <!-- Group -->
            <mat-form-field appearance="outline">
              <mat-label>Group</mat-label>
              <input matInput formControlName="group" placeholder="Enter Group">
            </mat-form-field>

            <!-- Created Date -->
            <mat-form-field appearance="outline">
              <mat-label>Created Date</mat-label>
              <input matInput [matDatepicker]="picker" formControlName="createdDate" placeholder="Select created date">
              <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
          </div>
          
        </div>

        <div class="button-container">
          <!-- Save/Update Button -->
          <button mat-raised-button color="primary" type="submit">
            <mat-icon>{{ isEditMode ? 'edit' : 'save' }}</mat-icon>
            {{ isEditMode ? 'UPDATE' : 'SAVE' }}
          </button>

          <!-- Reset Button -->
          <button mat-raised-button color="warn" type="button" (click)="onReset()">
            <mat-icon>refresh</mat-icon> CLEAR
          </button>

          <!-- Back Button -->
          <button mat-raised-button color="accent" type="button" (click)="goBack()">
            <mat-icon>arrow_back</mat-icon> BACK
          </button>
        </div>
        
      </form>
    </mat-card-content>
  </mat-card>
</div>
