

   <div class="container">

    
    <h2 class="heading">Report List</h2>
    <hr class="divider">
    <div class="header-container">
      <div class="search-bar">
       

        <input type="text" placeholder="Search Report..." [(ngModel)]="searchText" (input)="filterData()">
        <!-- <mat-icon>search</mat-icon> -->
        <button   color="primary"  (click)="clearsearch()">
  
      
          <mat-icon>close</mat-icon>
        </button>
      </div>
      
      <div class="button-container">
          <button mat-button color="primary" (click)="openAddDialog()">
              <mat-icon>add</mat-icon> ADD REPORT
          </button>
          <button mat-button color="primary" (click)="exportToExcel()">
              <mat-icon>file_download</mat-icon> EXPORT
          </button>
          <button mat-button color="primary"  (click)="goBack()">
            <mat-icon>arrow_back</mat-icon> BACK
          </button>
      </div>
  </div>
  
  
    <table mat-table [dataSource]="reportlist" class="mat-elevation-z8">
    
      
      <ng-container matColumnDef="ReportID">
          <th mat-header-cell *matHeaderCellDef>Report ID</th>
          <td mat-cell *matCellDef="let report">
            <input *ngIf="report.isNew" [(ngModel)]="report.ReportID" type="number" placeholder="Enter ReportID">
            <span *ngIf="!report.isNew">{{ report.ReportID }}</span>
          </td>
      </ng-container>
      <ng-container matColumnDef="GroupID">
        <th mat-header-cell *matHeaderCellDef>Group ID</th>
        <td mat-cell *matCellDef="let report">
          <input *ngIf="report.isNew" [(ngModel)]="report.GroupID" type="number" placeholder="">
          <span *ngIf="!report.isNew">{{ report.GroupID }}</span>
        </td>
    </ng-container>
      


      <ng-container matColumnDef="ReportName">
        <th mat-header-cell *matHeaderCellDef>Report Name</th>
        <td mat-cell *matCellDef="let report">
          <input *ngIf="report.isNew" [(ngModel)]="report.ReportName" type="number" placeholder="Enter ReportName">
          <span *ngIf="!report.isNew">{{ report.ReportName }}</span>
        </td>
    </ng-container>
  
      
      <ng-container matColumnDef="CustomerName">
        <th mat-header-cell *matHeaderCellDef>
          Customer</th>
        <td mat-cell *matCellDef="let report">
          <input *ngIf="report.isNew" [(ngModel)]="report.CustomerName" placeholder="Enter Customer Name">
          <span *ngIf="!report.isNew">{{ report.CustomerName }}</span>
        </td>
      </ng-container>
  
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let report">
            <button mat-icon-button color="primary" (click)="editreport(report)">
                <mat-icon> edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteReport(report.ID)">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
      </ng-container>
   
      
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr class="matrow" mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
    </table>
  </div>
