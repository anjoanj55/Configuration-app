  <div class="container">
   
    <h2 class="heading">Db Config</h2>
    <hr class="divider">
  
    <div class="header-container">
      <!-- Search Bar -->
      <div class="search-bar">
          
          <input type="text" placeholder="Search Customers..." [(ngModel)]="searchText">
          <mat-icon>search</mat-icon>
        </div>
    
      <!-- Button Group -->
      <div class="button-container">
        <button mat-button (click)="openAddDialog()">
          <mat-icon>add</mat-icon> CREATE
        </button>
        <button mat-button>
          <mat-icon>file_download</mat-icon> EXPORT
        </button>
        <button mat-raised-button color="primary" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon> BACK
        </button>
      </div>
    </div>
  
    <table mat-table [dataSource]="customers" class="mat-elevation-z8">
        <!-- Customer Type Column -->
        <ng-container matColumnDef="CustomerName">
            <th mat-header-cell *matHeaderCellDef>Customer Name</th>
            <td mat-cell *matCellDef="let CustomerName">
                <input *ngIf="CustomerName.isEditing" [(ngModel)]="CustomerName.CustomerName" type="text" placeholder="Enter Customer Type">
                <span *ngIf="!CustomerName.isEditing">{{ CustomerName.CustomerName }}</span>
            </td>
        </ng-container>
  
        <!-- Company Name Column -->
        <ng-container matColumnDef="DBName">
            <th mat-header-cell *matHeaderCellDef>DB Name</th>
            <td mat-cell *matCellDef="let DBName">
                <input *ngIf="DBName.isEditing" [(ngModel)]="DBName.DBName" placeholder="Enter company name">
                <span *ngIf="!DBName.isEditing">{{ DBName.DBName }}</span>
            </td>
        </ng-container>
  
        <!-- Phone Column -->
        <ng-container matColumnDef="ConnectionString">
            <th mat-header-cell *matHeaderCellDef>ConnectionString</th>
            <td mat-cell *matCellDef="let ConnectionString">
                <input *ngIf="ConnectionString.isEditing" [(ngModel)]="ConnectionString.ConnectionString" placeholder="Enter phone">
                <span *ngIf="!ConnectionString.isEditing">{{ ConnectionString.ConnectionString }}</span>
            </td>
        </ng-container>
  
        <!-- Address Column -->
        <ng-container matColumnDef="ClientId">
            <th mat-header-cell *matHeaderCellDef>ClientId</th>
            <td mat-cell *matCellDef="let ClientId">
                <input *ngIf="ClientId.isEditing" [(ngModel)]="ClientId.ClientId" placeholder="Enter address">
                <span *ngIf="!ClientId.isEditing">{{ ClientId.ClientId }}</span>
            </td>
        </ng-container>
  
     
        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let customer">
                <button mat-icon-button color="primary" (click)="toggleEdit(customer)">
                    <mat-icon>{{ customer.isEditing ? 'save' : 'edit' }}</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteCustomer(customer.CustID)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
    </table>
  </div>
